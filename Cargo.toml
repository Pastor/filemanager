[package]
name = "janus"
version = "0.1.0"
edition = "2024"
description = "Двухпанельный TUI-файловый менеджер"
authors = ["Pastor <viruszold@gmail.com>"]

[dependencies]
ratatui = "0.30"
crossbeam-channel = "0.5"
rayon = "1.12"
parking_lot = "0.12"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6"
unicode-width = "0.2"
anyhow = "1"
trash = "5.2"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4"
flate2 = "1"
zstd = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
